{% include base_path %}
<!-- start custom head snippets -->
<!-- Basic SEO meta tags -->
<title>{% if page.title %}{{ page.title }} – {{ site.title }}{% else %}{{ site.title }} – {{ site.description }}{% endif %}</title>
<meta name="description" content="{% if page.description %}{{ page.description | strip_html | escape }}{% else %}{{ site.description | escape }}{% endif %}" />
<meta name="author" content="Danislava Marinova" />
<meta name="keywords" content="political science, gender, labor market, parental leave, social policy, motherhood penalty, party instability, working poverty, PhD supervision, Dani Marinova" />
<!-- favicon from https://commons.wikimedia.org/wiki/File:OOjs_UI_icon_academic-progressive.svg -->
<link rel="apple-touch-icon" sizes="180x180" href="{{ base_path }}/images/apple-touch-icon-180x180.png"/>
<link rel="icon" type="image/svg+xml" href="{{ base_path }}/images/favicon.svg"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-32x32.png" sizes="32x32"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-192x192.png" sizes="192x192"/>
<link rel="manifest" href="{{ base_path }}/images/manifest.json"/>
<link rel="icon" href="/images/favicon.ico"/>
<meta name="theme-color" content="#ffffff"/>
<link rel="stylesheet" href="{{ base_path }}/assets/css/academicons.css"/>
<!-- Support for MatJax -->
<script async src="https://cdnjs.cloudflare.com/polyfill/v3/polyfill.min.js?features=es6"></script>
<script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" id="MathJax-script"></script>
<!-- Support for Mermaid -->
<script type="module">
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
    mermaid.initialize({startOnLoad:true, theme:'default'});
    await mermaid.run({querySelector:'code.language-mermaid'});
</script>
<!-- Support for Plotly -->
<script defer src='https://cdnjs.cloudflare.com/ajax/libs/plotly.js/3.0.1/plotly.min.js'></script>
<!-- Open Graph & Twitter Card metadata -->
<meta property="og:title" content="{% if page.title %}{{ page.title }} – Dani Marinova{% else %}Dani Marinova – Political Scientist{% endif %}" />
<meta property="og:description" content="{% if page.description %}{{ page.description | strip_html | escape }}{% else %}Research on gender, labor markets, and social policy.{% endif %}" />
<meta property="og:url" content="https://danimarinova.github.io{{ page.url }}" />
<meta property="og:type" content="website" />
<meta property="og:image" content="https://danimarinova.github.io/images/portrait.jpg" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="{% if page.title %}{{ page.title }} – Dani Marinova{% else %}Dani Marinova – Political Scientist{% endif %}" />
<meta name="twitter:description" content="{% if page.description %}{{ page.description | strip_html | escape }}{% else %}Research on gender, labor markets, and social policy.{% endif %}" />
<meta name="twitter:image" content="https://danimarinova.github.io/images/portrait.jpg" />
<!-- Structured data (JSON-LD) for search engines -->
{% if page.url == "/" or page.url == "/web/" %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Person",
  "name": "Danislava Marinova",
  "alternateName": "Dani Marinova",
  "jobTitle": "Serra Húnter Associate Professor of Political Science",
  "affiliation": {
    "@type": "CollegeOrUniversity",
    "name": "Universitat Autònoma de Barcelona",
    "url": "https://www.uab.cat"
  },
  "url": "https://danimarinova.github.io/web/",
  "image": "https://danimarinova.github.io/images/portrait.jpg",
  "email": "mailto:dani.marinova@uab.cat",
  "sameAs": [
    "https://scholar.google.com/citations?user=0Qgt2pUAAAAJ&hl=en",
    "https://orcid.org/0000-0001-7067-6792",
    "https://bsky.app/profile/petroleuse-sbd.bsky.social"
  ],
  "description": "Political scientist researching gender inequality, parental leave policy, and social policy, with a focus on the motherhood penalty and political representation.",
  "knowsAbout": [
    "Parental leave policy",
    "Gender inequality in labor markets",
    "Motherhood penalty",
    "Political behavior",
    "Political representation",
    "Party instability and electoral accountability",
    "Socioeconomic inequality",
    "Work-family conflict"
  ],
  "alumniOf": {
    "@type": "CollegeOrUniversity",
    "name": "Indiana University Bloomington"
  }
}
</script>
{% endif %}
<!-- end custom head snippets -->
